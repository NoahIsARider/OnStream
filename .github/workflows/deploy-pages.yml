name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's "packageManager" field.
      # Setting `version` here too makes action-setup abort with
      # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # .npmrc pins a China mirror for local installs; GitHub runners are better
      # off on the public registry. Env wins over the project .npmrc.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_registry: https://registry.npmjs.org/

      # Produces out/ as a fully static site; basePath comes from GITHUB_REPOSITORY.
      - name: Build static export
        run: pnpm exec next build --webpack
        env:
          GITHUB_PAGES: 'true'

      # Belt and braces: a branch-based Pages deploy would otherwise run Jekyll
      # and silently drop _next/ (underscore-prefixed paths are excluded).
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
